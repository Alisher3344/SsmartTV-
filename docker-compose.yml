# SsmartTv local dev infra: PostgreSQL + Redis
# Works with `docker compose up -d` or `podman-compose up -d`.
services:
  postgres:
    image: docker.io/library/postgres:16
    container_name: ssmarttv-postgres
    environment:
      POSTGRES_USER: ssmart
      POSTGRES_PASSWORD: ssmart
      POSTGRES_DB: ssmarttv
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssmart -d ssmarttv"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7
    container_name: ssmarttv-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./TvBackend
    container_name: ssmarttv-api
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://ssmart:ssmart@postgres:5432/ssmarttv
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-dev-secret
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata: {}
