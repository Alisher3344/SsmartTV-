[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssmarttv"
version = "2.0.0"
description = "SsmartTv backend — IPTV + VOD platform (FastAPI, RBAC, OTP, premium)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "redis==5.2.1",
    "pydantic-settings==2.7.0",
    "email-validator==2.2.0",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "phonenumbers==8.13.52",
    "argon2-cffi==23.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "fakeredis==2.26.2",
    "ruff==0.9.2",
    "mypy==1.14.1",
    "coverage==7.6.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ssmarttv"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "TID", "RUF"]
# B008: FastAPI Depends() in defaults is idiomatic.
# RUF012: SQLAlchemy __mapper_args__/__table_args__ are mutable class attrs by design.
ignore = ["B008", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["ssmarttv"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["fakeredis.*", "phonenumbers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["ssmarttv"]
branch = true
